name: Queue a PC clip
# The PC sends its best clips here; the cloud posts them to Instagram, Facebook and Threads.
on:
  workflow_dispatch:
    inputs:
      video_url: { required: true, type: string }
      meta: { required: false, type: string, default: "{}" }
run-name: "PC clip ${{ inputs.video_url }}"
permissions:
  contents: write
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VIDEO_URL: ${{ inputs.video_url }}
      META: ${{ inputs.meta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash .github/workflows/setup.sh
      - run: python ingest.py "$VIDEO_URL" "$META"
      - name: Save state
        if: always()
        run: python sync_state.py "pc clip $(date -u +%FT%H%M)"
