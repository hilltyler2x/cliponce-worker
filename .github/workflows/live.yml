name: Live auto-clip
on:
  schedule:
    - cron: "*/15 * * * *"   # check streamers every 15 minutes
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      EXTRA_PIP: faster-whisper chat-downloader
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Anyone live?
        id: check
        run: |
          pip install -q yt-dlp requests
          (python live.py --check | grep "^live=" || echo live=0) >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.live == '1'
        run: bash .github/workflows/setup.sh
      - if: steps.check.outputs.live == '1'
        run: python live.py
      - name: Save state
        if: always() && steps.check.outputs.live == '1'
        run: git add state && (git commit -qm "live $(date -u +%FT%H%M)" && git pull -q --rebase -X theirs && git push -q || true)
