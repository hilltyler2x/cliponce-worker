name: Fresh autopilot
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes: grab new moments before anyone else posts them
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # lets the worker prove to cliponce.vercel.app that it is this repo's run (brand list)
concurrency:
  group: state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      EXTRA_PIP: faster-whisper
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_GRAPH_HOST: ${{ secrets.IG_GRAPH_HOST }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash .github/workflows/setup.sh
      - run: python twitch_autopilot.py
      - run: python backfill_covers.py || true
      - run: python post_queue.py
      - name: Save state
        if: always()
        run: python sync_state.py "autopilot $(date -u +%F)"
